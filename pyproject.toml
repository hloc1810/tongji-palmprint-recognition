[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tongji-palmprint-recognition"
version = "0.1.0"
description = "Reproducible Tongji cross-session palmprint identification research"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3", "scipy>=1.11", "pandas>=2.0", "scikit-learn>=1.4",
  "opencv-python-headless>=4.8", "Pillow>=10", "matplotlib>=3.7",
  "PyYAML>=6", "joblib>=1.3", "scikit-image>=0.22",
]
[project.optional-dependencies]
cnn = ["torch>=2.2", "torchvision>=0.17"]
palmnet = ["torch>=2.2", "sparse-dot-topn>=1.2,<2"]
demo = ["streamlit>=1.37"]
api = ["fastapi", "uvicorn", "python-multipart"]
test = ["pytest>=8", "ruff>=0.7", "fastapi", "uvicorn", "python-multipart", "httpx"]

[project.scripts]
palmprint = "palmprint.cli:main"
palmprint-cnn = "palmprint.cli_cnn:main"
palmprint-palmnet = "palmprint.training.palmnet:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
