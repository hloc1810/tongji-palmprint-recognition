name: Python tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install -e '.[test]'
      - name: Install CPU CNN dependencies
        run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Lint and formatting
        run: |
          python -m ruff check src app scripts tests
          python -m ruff format --check src app scripts tests
      - name: Unit and synthetic integration tests
        run: |
          mkdir -p validation
          python -m pytest -q -ra --junitxml=validation/pytest.xml
      - name: Synthetic end-to-end smoke test
        run: python scripts/run_smoke.py
      - name: Record resolved dependency versions
        if: always()
        run: |
          mkdir -p validation
          python -m pip freeze > validation/dependencies.txt
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-python-${{ matrix.python-version }}
          path: validation/
